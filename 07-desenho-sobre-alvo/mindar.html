<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teste 07 · MindAR</title>
  <link rel="stylesheet" href="estilo.css">
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="alvos.js"></script>
  <script src="medicao.js"></script>
  <script src="objetos.js"></script>
</head>
<body>
  <div class="hud">
    <div class="topo"><span id="h-motor"></span><span class="aparelho" id="h-aparelho"></span></div>
    <div class="local" id="h-local"></div>
    <div class="estado" id="h-estado">à procura…</div>
    <dl>
      <dt>1.º reconhecimento</dt><dd id="h-primeiro">—</dd>
      <dt>Perdas do alvo</dt><dd id="h-perdas">0</dd>
      <dt>Tempo reconhecido</dt><dd id="h-pct">—</dd>
      <dt>Tremor (últimos 2 s)</dt><dd id="h-tremor">—</dd>
      <dt>Tremor (medição 5 s)</dt><dd id="h-tremor5">—</dd>
    </dl>
    <div class="pontos" id="h-pontos" hidden></div>
  </div>
  <div class="barra">
    <button id="b-recomecar">Recomeçar</button>
    <button id="b-tremor">Medir tremor (5 s)</button>
    <button id="b-guardar">Guardar resultado</button>
    <button id="b-foto">Fotografar a RA</button>
    <button id="b-desenho">Desenho</button>
    <button id="b-moldura">Moldura</button>
    <button id="b-estab">Estabilizar</button>
    <a href="./">Voltar</a>
  </div>
  <div id="cena"></div>
  <script>
    // MindAR: o alvo mede 1 de largura; a altura segue a proporção da fotografia
    // Estabilização (filtro «One Euro» do MindAR): quanto mais forte, menos tremor e mais atraso quando te mexes.
    // filterMinCF baixo = menos tremor parado; filterBeta baixo = mais atraso nos movimentos rápidos.
    // O nível fica guardado no telemóvel; mudar recarrega a página (o MindAR só lê estes valores ao arrancar).
    const ESTAB = {
      normal: { nome: "normal", cf: 0.001, beta: 1000 },  // valores de origem do MindAR (os dos testes 03–06)
      media:  { nome: "média",  cf: 0.0001, beta: 10 },
      forte:  { nome: "forte",  cf: 0.0001, beta: 0.001 }, // o exemplo da documentação do MindAR para tremor
    };
    const ORDEM = ["normal", "media", "forte"];
    let nivel = "normal";
    try { nivel = localStorage.getItem("oceano-teste07-estab") || "normal"; } catch (e) {}
    if (!ESTAB[nivel]) nivel = "normal";
    const be = document.getElementById("b-estab");
    be.textContent = "Estabilizar: " + ESTAB[nivel].nome;
    be.onclick = () => {
      const seg = ORDEM[(ORDEM.indexOf(nivel) + 1) % ORDEM.length];
      try { localStorage.setItem("oceano-teste07-estab", seg); } catch (e) {}
      location.reload();
    };
    Medicao.estab = ESTAB[nivel].nome;
    registarMedidor();
    registarObjetos();
    (async () => {
      const id = new URLSearchParams(location.search).get("alvo");
      const a = id && await Alvos.ler(id);
      if (!a || !a.mind) { alert("Este alvo não existe neste telemóvel ou não tem versão MindAR. Volta e cria-o."); location.href = "./"; return; }
      const w = 1, h = a.altura / a.largura;
      // moldura amarela + objetos 3D com sombra (ver objetos.js)
      document.getElementById("cena").innerHTML =
        '<a-scene mindar-image="imageTargetSrc: ' + urlDe(a.mind) + '; maxTrack: 1; filterMinCF: ' + ESTAB[nivel].cf + '; filterBeta: ' + ESTAB[nivel].beta + '; uiScanning: no; uiLoading: yes; uiError: yes"' +
        ' shadow="type: pcfsoft" color-space="sRGB" renderer="colorManagement: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">' +
        htmlAssetsDesenho(a) + '<a-camera position="0 0 0" look-controls="enabled: false"></a-camera>' +
        '<a-entity id="ancora" mindar-image-target="targetIndex: 0" medidor>' +
          htmlMoldura(a, w, h) + htmlDesenho(a, w, h) + htmlObjetos(a, w, h) +
        '</a-entity></a-scene>';
      mostrarLegenda(a);
      ligarBotoesDesenho(a);
      const ancora = document.getElementById("ancora");
      ancora.addEventListener("targetFound", () => Medicao.encontrado());
      ancora.addEventListener("targetLost", () => Medicao.perdido());
      document.querySelector("a-scene").addEventListener("arReady", () => Medicao.recomecar());
      Medicao.iniciar("MindAR", a);
    })();
  </script>
</body>
</html>
