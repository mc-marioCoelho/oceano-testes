<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teste 03 · Zappar</title>
  <link rel="stylesheet" href="estilo.css">
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://libs.zappar.com/zappar-aframe/2.0.0/zappar-aframe.js"></script>
  <script src="medicao.js"></script>
</head>
<body>
  <div class="hud">
    <div class="topo"><span id="h-motor"></span><span class="aparelho" id="h-aparelho"></span></div>
    <div class="estado" id="h-estado">à procura…</div>
    <dl>
      <dt>1.º reconhecimento</dt><dd id="h-primeiro">—</dd>
      <dt>Perdas do alvo</dt><dd id="h-perdas">0</dd>
      <dt>Tempo reconhecido</dt><dd id="h-pct">—</dd>
      <dt>Tremor (últimos 2 s)</dt><dd id="h-tremor">—</dd>
      <dt>Tremor (medição 5 s)</dt><dd id="h-tremor5">—</dd>
    </dl>
  </div>
  <div class="barra">
    <button id="b-recomecar">Recomeçar</button>
    <button id="b-tremor">Medir tremor (5 s)</button>
    <button id="b-guardar">Guardar resultado</button>
    <a href="./">Voltar</a>
  </div>
  <div id="cena"></div>
  <script>
    // Zappar: o alvo mede 2 de altura (de -1 a 1); a largura segue a proporção da imagem
    registarMedidor();
    const { alvo } = parametros();
    const a = ALVOS[alvo], h = 2, w = 2 * a.aspeto, t = 0.012 * Math.max(w, h);
    const borda = (x, y, bw, bh) => '<a-plane position="' + x + ' ' + y + ' 0.001" width="' + bw + '" height="' + bh + '" material="color:#ffd000; shader:flat"></a-plane>';
    document.getElementById("cena").innerHTML =
      '<a-scene vr-mode-ui="enabled: false">' +
      '<a-entity zappar-permissions-ui></a-entity><a-entity zappar-compatibility-ui></a-entity>' +
      '<a-entity camera zappar-camera></a-entity>' +
      '<a-entity id="ancora" zappar-image="target: alvos/' + alvo + '.zpt" medidor>' +
        '<a-plane width="' + w + '" height="' + h + '" material="color:#ffd000; opacity:0.3; transparent:true; shader:flat"></a-plane>' +
        borda(0, h / 2, w, t) + borda(0, -h / 2, w, t) + borda(-w / 2, 0, t, h) + borda(w / 2, 0, t, h) +
      '</a-entity></a-scene>';
    const ancora = document.getElementById("ancora");
    ancora.addEventListener("zappar-visible", () => Medicao.encontrado());
    ancora.addEventListener("zappar-notvisible", () => Medicao.perdido());
    Medicao.iniciar("Zappar", alvo);
  </script>
</body>
</html>
